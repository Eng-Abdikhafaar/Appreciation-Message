name: Appreciation Message CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f Src/index.html
          test -f Src/style.css
          echo "Appreciation Message project files verified successfully."

      - name: Project check complete
        run: echo "✅ Appreciation Message CI passed successfully!"